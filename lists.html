<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Lists</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Grocery Lists</h1>

    <!-- Unordered List (Fruits) -->
    <h2>Fruits (Unordered List)</h2>
    <ul>
        <li>Apples</li>
        <li>Grapes</li>
        <li>Oranges</li>
        <li>Strawberries</li>
    </ul>

    <!-- Ordered List (Grocery Items) -->
    <h2>Grocery Items (Ordered List)</h2>
    <ol>
        <li>Eggs</li>
        <li>Milk</li>
        <li>Flour</li>
        <li>Sugar</li>
    </ol>
</body>
</html>
